name: girlfriend
description: "A new Flutter project."

publish_to: 'none'

version: 24.0.0+24

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image_ce: ^4.6.4
  http: ^1.2.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  provider: ^6.1.2
  firebase_analytics: ^12.1.0
  expressive_loading_indicator: ^0.0.1
  shared_preferences: ^2.5.4
  flutter_upgrade_version: ^1.1.8
  chatview: ^3.0.0
  firebase_remote_config: ^6.1.4
  package_info_plus: ^9.0.0
  google_mobile_ads: ^7.0.0
  shimmer_animation: ^2.2.2+1
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.0
  sqflite: ^2.4.2
  smooth_list_view: ^2.0.2
  image_cropper: ^12.2.1
  internet_connection_checker_plus: ^2.9.1+2
  fluttertoast: ^9.0.0
  dio: ^5.9.1
  dartz: ^0.10.1
  talker_dio_logger: ^5.1.13
  device_info_plus: ^12.4.0
  persistent_device_id: ^1.1.0
  crypto: ^3.0.7
  google_sign_in: ^6.2.1
  google_one_tap_sign_in: ^1.0.8
  lottie: ^3.3.2
  in_app_review: ^2.0.11
  onesignal_flutter: ^5.4.1
  uuid: ^4.5.3
  video_player: ^2.11.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  gal: ^2.3.1
  visibility_detector: ^0.4.0+2
  animate_do: ^4.2.0
  flutter_local_notifications: ^21.0.0
  firebase_database: ^12.1.4
  in_app_purchase: ^3.2.3
  gradient_borders: ^1.0.2
  grokbot_widget: ^0.1.0
  dart_jsonwebtoken: ^3.3.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/svg/
    - assets/images/
    - assets/lottie/
    - assets/video/
    - android/app/src/main/res/values/secrets.xml
    - ios/Runner/Secrets.plist

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-SemiBoldItalic.ttf
          weight: 600
